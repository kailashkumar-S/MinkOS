---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: minkos
# description will be included in the image's metadata
description: minkos - My distro based on ublue OS base-main with Hyprland

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # Hyprland desktop layer (base-main ships no desktop environment)
  # Hyprland and the hypr* tools come from Fedora's own repos
  # (solopasha/hyprland COPR only builds for rawhide, so it fails on Fedora 44)
  - type: dnf
    install:
      packages:
        # compositor + hypr ecosystem
        - hyprland
        - hyprpaper
        - hypridle
        - hyprlock
        - hyprpolkitagent
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
        - qt5-qtwayland
        - qt6-qtwayland
        # login manager
        - greetd
        - tuigreet
        # desktop essentials
        - waybar
        - fuzzel
        - mako
        - kitty
        - grim
        - slurp
        - wl-clipboard
        - cliphist
        - brightnessctl
        - playerctl
        - pavucontrol
        - network-manager-applet
        - blueman
        - pipewire
        - wireplumber
        - pipewire-pulseaudio
        - google-noto-sans-fonts
        - google-noto-emoji-fonts
        - fontawesome-fonts-all

  # copy after package installs so our configs (e.g. /etc/greetd/config.toml) win
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image's root folder /

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: script
    scripts:
      - graphical-target.sh

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - btop
        - fzf
        - ripgrep
        - bat
        - eza
        - zoxide
        - neovim
        - tmux
        - fd-find

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        # add an `install:` list here with flatpak IDs (e.g. - org.mozilla.firefox)
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
